[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openproject-discord-bridge"
version = "0.2.0"
description = "Per-user OpenProject notifications in private Discord channels"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4,<3", "httpx>=0.28,<0.29", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "cryptography>=44", "python-dotenv>=1,<2", "filelock>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
op-discord = "op_discord.main:main"
op-discord-check = "op_discord.check:main"
op-discord-admin = "op_discord.admin:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
